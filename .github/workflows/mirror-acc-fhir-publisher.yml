name: Publish to acc-fhir-publisher (build.fhir.org)

on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on:
      group: general-linux
     
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - uses: azure/login@v2
        with:
          creds: ${{secrets['AZURE_CREDENTIALS_NONPROD']}}

      - name: Fetch SSH key from Key Vault
        shell: bash
        run: |
          install -m 600 -D /dev/null ~/.ssh/icp_ssh_private_key
          az keyvault secret show \
            --vault-name "SYD-PDD-KVT-INT-NONPROD" \
            --name "icp-fhir-ig-ssh-private-key-base64" \
            --query value -o tsv | base64 -d > ~/.ssh/icp_ssh_private_key
          ssh-keygen -y -f ~/.ssh/icp_ssh_private_key > /dev/null && echo "key OK"

      - name: Push to acc-fhir-publisher
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/icp_ssh_private_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
        run: |
          git remote set-url origin ssh://git@ssh.github.com:443/acc-fhir-publisher/icp.git
          git push -u origin "${{ github.ref_name }}"

      - name: Remove key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/icp_ssh_private_key
