name: Publish IG package to ACC Nexus
on:
  workflow_dispatch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: accnewzealand/ig-publisher:1.6.15
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    permissions:
      packages: write
      contents: read  
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Set Java Heap Space
        run: |
          echo "export JAVA_TOOL_OPTIONS='-Xmx2g'" >> $GITHUB_ENV

      - name: Copy shell script file
        run: |
          mkdir -p /apps/icp
          cp -r * /apps/icp/
          chmod +x /apps/icp/build-publish.sh

      - name: Run shell script
        run: |
          /apps/icp/build-publish.sh

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18
          registry-url: https://nexus.ds.acc.co.nz/repository/npm-integration/

      - name: Create package.json
        run: |
          cd /apps/icp/package
          echo '{
            "name": "@integration-services-accnz/icp",
            "version": "1.1.43",
            "publishConfig": {
                "registry": "https://npm.pkg.github.com"
              },
            "repository":"https://github.com/integration-services-accnz/icp",
            "canonical": "http://hl7.org.nz/fhir/icp",
            "url": "http://hl7.org.nz/fhir/icp",
            "title": "New Zealand ICP Implementation Guide",
            "description": "The ICP facade",
            "language": "en",
            "author": "ACC Integration",
            "maintainers": [
                {
                    "name": "ACC Integration",
                    "email": "digitaloperations@acc.co.nz"
                }
            ],
            "license": "CC0-1.0"
          }' > package.json

      - name: Login via Az module
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS_PROD}}
          enable-AzPSSession: true
      - name: Create .npmrc
        shell: bash
        run: |
          touch ./.npmrc
          encoded_string=$(echo -n "${{env.prdnexususer}}":"${{env.prdnexustoken}}" | base64)

          echo "registry=https://nexus.ds.acc.co.nz/repository/npm-public-integration/" >> ./.npmrc
          echo "//nexus.ds.acc.co.nz/repository/npm-public-integration/:_auth=$encoded_string" >> ./.npmrc

      - name: Set .npmrc to private for publishing
        run: |
          npm config set registry="https://nexus.ds.acc.co.nz/repository/npm-integration/"
          encoded_string=$(echo -n "${{env.prdnexususer}}":"${{env.prdnexustoken}}" | base64)
          npm config set //nexus.ds.acc.co.nz/repository/npm-integration/:_auth=$encoded_string

      - name: Publish to ACC Nexus Package Registry
        run: |
          cd /apps/icp/package
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

